name: Research and linked-data checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-connections.mjs
      - run: node tests/agent-contributions.mjs
      - run: node tests/institution-code-expansion.mjs
      - run: node tests/connections.mjs
      - run: node tests/processing-lineage.mjs
      - run: node tests/new-people.mjs
      - run: node tests/connection-links.mjs
      - run: node tests/connection-fundamentals.mjs
      - run: node tests/languages.mjs
      - run: node tests/ingredients-expansion.mjs
      - run: python3 scripts/package-art-skill.py
      - run: node scripts/export-research.mjs
      - name: Verify committed exports are current
        run: git diff --exit-code -- dist/connections/data.json research/connections-coverage.json dist/research/project/ dist/skills/vibes-algorithmic-art/
