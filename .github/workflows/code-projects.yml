name: Refresh public code projects
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: write
concurrency:
  group: ingredient-review-ledger
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: git pull --ff-only origin main
      - run: node scripts/refresh-code-projects.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name 'Vibes Ingredients Reviewer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/connections/code-projects.json
          git diff --cached --quiet || git commit -m 'Refresh public code project snapshots'
          git push origin HEAD:main
