name: Review ingredient contributions
on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: ingredient-review-ledger
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[ingredient]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: git config user.name 'Vibes Ingredients Reviewer'
      - run: git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: node tests/agent-contributions.mjs
      - name: Review queue within monthly allowance
        run: node scripts/agents/process.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
