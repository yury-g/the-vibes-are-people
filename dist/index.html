<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore moving algorithmic art and meet the people behind its recipes. Techniques are recipes. People are the ingredients."><link rel="canonical" href="https://thevibesarepeople.com/"><title>The Vibes Are People</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif}header{padding:16px 24px;border-bottom:3px solid #111;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0}p{font-size:12px;margin:6px 0 0}nav{display:flex;gap:12px;flex-wrap:wrap}a,button{color:inherit;font:12px monospace}button{padding:8px 12px;border:1px solid #111;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#111;color:#fff}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 94px);min-height:500px}section{display:flex;flex-direction:column;min-width:0}section+section{border-left:3px solid #111}h2{font:12px monospace;margin:0;padding:12px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #111}iframe{width:100%;flex:1;border:0;background:#fff}[hidden]{display:none!important}body[data-view=a] main,body[data-view=b] main{grid-template-columns:1fr}a:focus-visible,button:focus-visible{outline:3px solid #000;outline-offset:3px}@media(max-width:700px){header{align-items:start;flex-direction:column;padding:14px;gap:12px}main{height:auto;grid-template-columns:1fr}section{height:85dvh}section+section{border-left:0;border-top:3px solid #111}h1{font-size:15px}}</style></head>
<body data-view="both"><header><div><h1>THE VIBES ARE PEOPLE / A–B</h1><p>Explore the contact sheet. Read the human ingredients.</p></div><nav aria-label="Compare presentations"><button data-view="a" aria-pressed="false">A · Minimal</button><button data-view="both" aria-pressed="true">Side by side</button><button data-view="b" aria-pressed="false">B · Ingredients</button></nav></header>
<main><section id="a"><h2>A / ORIGINAL <a href="/notes/living/" target="_blank" rel="noopener">Open A ↗</a></h2><iframe src="/notes/living/" title="Variant A: original minimal Living Index"></iframe></section><section id="b"><h2>B / INGREDIENT INDEX <a href="/notes/ingredients/techniques.html" target="_blank" rel="noopener">Open B ↗</a></h2><iframe src="/notes/ingredients/techniques.html" title="Ingredient index: recipes, people and portraits"></iframe></section></main>
<script>document.querySelectorAll('button[data-view]').forEach(button=>button.onclick=()=>{const view=button.dataset.view;document.body.dataset.view=view;document.querySelector('#a').hidden=view==='b';document.querySelector('#b').hidden=view==='a';document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))});</script></body></html>
